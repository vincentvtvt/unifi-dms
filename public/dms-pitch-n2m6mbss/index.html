<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Unifi DMS · Pelan Anda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 1600x900 keynote stage. One idea per slide, photo-led, giant type, no boxed cards. Unifi blue + orange on white, with full-bleed blue and ink slides for rhythm. Single look by choice. */
:root{
  --blue:#1400DD; --blue-d:#0B0090; --or:#EC692C; --ink:#0E1222; --mute:#6B7084; --rule:#E7E3DD; --paper:#FFFFFF; --cream:#FBF6F0; --wa:#25D366;
  --disp:"Archivo","Noto Sans SC","Arial Black",Arial,sans-serif; --body:"Roboto","Noto Sans SC",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--body)}
h1,h2,h3,p{margin:0}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--or);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.D{font-family:var(--disp);font-stretch:125%;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;line-height:.92}

/* chrome */
.bar{position:fixed;inset:0 0 auto;height:3.25rem;display:flex;align-items:center;gap:1rem;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:var(--paper);border-bottom:1px solid var(--rule);z-index:5}
.logo{font-family:var(--disp);font-stretch:125%;font-weight:900;font-size:1.0625rem;color:var(--blue);white-space:nowrap}
.logo span{color:var(--or)}
.dots{flex:1;display:flex;justify-content:center;gap:1.4rem;min-width:0;overflow-x:auto;scrollbar-width:none}
.dots button{border:0;background:none;padding:.3rem 0;font-size:.8125rem;font-weight:700;color:var(--mute);cursor:pointer;white-space:nowrap;border-bottom:1px solid transparent}
.dots button[aria-current="true"]{color:var(--ink);border-color:var(--or)}
.proto{font-size:.6875rem;font-weight:700;color:var(--or);letter-spacing:.1em;text-transform:uppercase}
.viewport{position:fixed;inset:3.25rem 0 0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--paper)}
.stage{width:1600px;height:900px;position:relative;flex:none;transform-origin:center;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}
.slide.on{opacity:1;visibility:visible}
.slide .in{transform:translateY(1.2rem);opacity:0;transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .6s}
.slide.on .in{transform:none;opacity:1}
.slide.on .in.d2{transition-delay:.1s}.slide.on .in.d3{transition-delay:.2s}.slide.on .in.d4{transition-delay:.3s}
.kick{font-size:1rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--or)}
.say{position:absolute;left:4rem;bottom:1.4rem;font-size:1.0625rem;color:var(--mute);max-width:70rem}
.say b{color:var(--or);font-size:.75rem;letter-spacing:.16em;margin-right:.6rem}
.dark .say{color:rgba(255,255,255,.7)}
.navbtns{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(1rem + env(safe-area-inset-bottom,0px));display:flex;gap:.5rem;z-index:6}
.navbtns button{width:3rem;height:3rem;border-radius:50%;border:1px solid var(--ink);background:var(--paper);color:var(--ink);font-size:1.25rem;cursor:pointer}
.navbtns button.next{background:var(--or);border-color:var(--or);color:#fff}
.navbtns button[disabled]{opacity:.25;cursor:default}

/* 1 · industry picker: photo wall */
.s1{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:4px;background:var(--ink)}
.tile{position:relative;border:0;padding:0;cursor:pointer;overflow:hidden;background:#222 center/cover no-repeat;text-align:left}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,18,34,.1) 30%,rgba(14,18,34,.88));transition:background .3s}
.tile:hover::after{background:linear-gradient(180deg,rgba(20,0,221,.25) 0%,rgba(14,18,34,.9))}
.tile .t{position:absolute;left:2rem;right:2rem;bottom:1.8rem;z-index:1;color:#fff;display:flex;flex-direction:column;gap:.4rem}
.tile .t b{font-family:var(--disp);font-stretch:125%;font-weight:900;font-size:2.125rem;line-height:1;text-transform:uppercase}
.tile .t small{font-size:1.125rem;opacity:.8}
.tile.other{background:var(--blue)}
.tile.other::after{background:none}
.tile.other .q{position:absolute;right:2rem;top:1rem;font-family:var(--disp);font-stretch:125%;font-weight:900;font-size:12rem;line-height:1;color:rgba(255,255,255,.14)}
.s1wrap{display:flex;flex-direction:column}
.s1wrap .s1{flex:1;min-height:0}
.ask{background:var(--paper);padding:2rem 4rem 1.5rem;display:flex;flex-direction:column;gap:.5rem}
.ask h2{font-size:3.5rem}
.ask h2 em{font-style:normal;color:var(--blue)}

/* 2 · story */
.s2{display:grid;grid-template-columns:44% 1fr}
.pic{position:relative;overflow:hidden;background:var(--ink)}
.pic .blur{position:absolute;inset:-2rem;background:center/cover no-repeat;filter:blur(28px) brightness(.7);transform:scale(1.1)}
.pic img{position:absolute;inset:3rem 2.5rem 7rem;width:calc(100% - 5rem);height:calc(100% - 10rem);object-fit:contain;filter:drop-shadow(0 20px 40px rgba(0,0,0,.45))}
.pic .cap{position:absolute;left:2.5rem;right:2.5rem;bottom:2rem;color:#fff;display:flex;justify-content:space-between;align-items:flex-end;gap:1rem}
.pic .cap b{display:block;font-size:1.5rem}
.pic .cap small{font-size:1.0625rem;opacity:.8}
.pic .cap span{border:1px solid rgba(255,255,255,.6);border-radius:999px;padding:.4rem .9rem;font-weight:700;font-size:.9375rem;white-space:nowrap}
.slide:nth-child(2) .say{left:calc(44% + 4.5rem)}
.tell{padding:4rem 4.5rem 5rem;display:flex;flex-direction:column;gap:1.6rem;min-width:0}
.tell h2{font-size:3.75rem}
.tell h2 em{font-style:normal;color:var(--blue)}
.was{display:flex;gap:1rem;align-items:baseline;font-size:1.5rem;color:var(--mute);border-top:1px solid var(--rule);padding-top:1.4rem}
.was b{font-size:.875rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);flex:none}
.stat{display:flex;flex-direction:column;gap:.4rem}
.stat .v{font-family:var(--disp);font-stretch:125%;font-weight:900;font-size:10rem;line-height:.85;color:var(--or);letter-spacing:-.03em}
.stat .l{font-size:1.75rem;font-weight:700}
.tell p.more{font-size:1.4375rem;line-height:1.45;color:var(--ink);max-width:40rem}
.quote{margin-top:auto;font-family:var(--disp);font-stretch:110%;font-weight:700;font-size:1.625rem;line-height:1.25;color:var(--blue);border-left:1px solid var(--or);padding-left:1.2rem}
.other-st{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.other-st small{font-size:.875rem;color:var(--mute);font-weight:700;margin-right:.3rem}
.other-st button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:.35rem .8rem;font-size:.9375rem;font-weight:700;cursor:pointer}
.other-st button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* 3 · what we did: full blue */
.s3{background:var(--blue);color:#fff;padding:4rem 4rem 5rem;display:flex;flex-direction:column;gap:2.4rem}
.s3 .kick{color:#FFB487}
.s3 h2{font-size:4rem}
.s3 h2 em{font-style:normal;color:#FFB487}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:3rem;flex:1;min-height:0}
.fl{display:flex;flex-direction:column;gap:1rem;border-top:1px solid rgba(255,255,255,.3);padding-top:1.4rem;min-width:0}
.fl .n{font-family:var(--disp);font-stretch:125%;font-weight:900;font-size:5rem;line-height:.8;color:#FFB487}
.fl h3{font-family:var(--disp);font-stretch:120%;font-weight:900;font-size:2rem;line-height:1.05;text-transform:uppercase}
.fl p{font-size:1.375rem;line-height:1.45;color:rgba(255,255,255,.82)}
.fl .mock{margin-top:auto}
.bub{max-width:88%;border-radius:1.1rem;padding:.7rem 1rem;font-size:1.125rem;line-height:1.3;color:var(--ink)}
.bub small{display:block;font-size:.8125rem;color:var(--mute);font-weight:700;margin-bottom:.15rem}
.bub.in{background:#fff;border-bottom-left-radius:.3rem}
.bub.out{background:#DCF8C6;border-bottom-right-radius:.3rem;margin:.5rem 0 0 auto;width:fit-content}
.posterm{display:flex;gap:.8rem;align-items:stretch}
.posterm img{width:58%;aspect-ratio:4/3;object-fit:cover;border-radius:.9rem;background:#fff}
.posterm div{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.6rem;font-size:1.0625rem;font-weight:700}
.posterm div span{background:rgba(255,255,255,.14);border-radius:.6rem;padding:.5rem .7rem}
.ping{display:flex;gap:.8rem;align-items:center;background:#fff;color:var(--ink);border-radius:1rem;padding:.7rem .9rem;font-size:1.0625rem;font-weight:700}
.ping+.ping{margin-top:.5rem;opacity:.85}
.ping i{width:2.2rem;height:2.2rem;border-radius:50%;background:var(--wa);flex:none}
.ping small{display:block;font-weight:400;color:var(--mute);font-size:.9375rem}
.deal{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(255,255,255,.3)}
.deal div{padding-top:1.2rem;display:flex;gap:1.2rem;align-items:baseline}
.deal b{font-size:.875rem;letter-spacing:.16em;text-transform:uppercase;color:#FFB487;flex:none}
.deal span{font-size:1.375rem}

/* 4 · your business */
.s4{display:grid;grid-template-columns:1.15fr 1fr;padding:4rem 4rem 5rem;gap:4rem}
.form{display:flex;flex-direction:column;gap:1.8rem;min-width:0}
.form h2{font-size:3.75rem}
.form h2 em{font-style:normal;color:var(--blue)}
.f{display:flex;flex-direction:column;gap:.5rem}
.f label,.f .fl2{font-size:.875rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.f input{border:0;border-bottom:1px solid var(--ink);background:transparent;padding:.2rem 0 .5rem;font-family:var(--disp);font-stretch:110%;font-weight:800;font-size:2.25rem;width:100%;outline:0}
.f input:focus{border-color:var(--or)}
.seg{display:flex;flex-wrap:wrap;gap:.5rem}
.seg button{border:1px solid var(--ink);background:var(--paper);border-radius:999px;padding:.6rem 1.15rem;font-size:1.1875rem;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.phonewrap{position:relative;display:flex;align-items:center;justify-content:center;background:var(--cream);border-radius:2.5rem;min-width:0}
.phone{width:21rem;height:39rem;margin-bottom:2rem;border:0;outline:.7rem solid var(--ink);outline-offset:0;margin:.7rem;border-radius:3rem;background:#F0F2F5;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 40px 80px -40px rgba(14,18,34,.6)}
.notch{height:1.6rem;display:flex;justify-content:center;background:#fff}
.notch i{width:6rem;height:1.1rem;border-radius:0 0 .8rem .8rem;background:var(--ink)}
.fbtop{background:#fff;padding:.5rem .9rem;font-weight:900;font-size:1.25rem;color:#1877F2;font-family:var(--body)}
.post{background:#fff;margin-top:.5rem;display:flex;flex-direction:column}
.ph{display:flex;gap:.6rem;align-items:center;padding:.7rem .9rem}
.ph i{width:2.4rem;height:2.4rem;border-radius:50%;background:var(--or);flex:none}
.ph b{display:block;font-size:1rem}
.ph small{font-size:.8125rem;color:var(--mute)}
.ptext{padding:0 .9rem .6rem;font-size:.9375rem;line-height:1.35}
.creative{aspect-ratio:1/1;background:linear-gradient(155deg,#3A20FF,var(--blue) 50%,var(--blue-d));color:#fff;padding:1.3rem;display:flex;flex-direction:column;justify-content:space-between}
.creative small{font-size:.75rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#FFB487}
.creative b{font-family:var(--disp);font-stretch:115%;font-weight:900;font-size:1.875rem;line-height:1.02;text-transform:uppercase}
.creative span{align-self:flex-start;background:var(--or);border-radius:999px;padding:.35rem .8rem;font-weight:700;font-size:.875rem}
.pcta{display:flex;justify-content:space-between;align-items:center;padding:.6rem .9rem;font-size:.875rem;color:var(--mute)}
.pcta span{background:#E4E6EB;color:var(--ink);font-weight:700;border-radius:.4rem;padding:.4rem .7rem}
.pcta span.wa{background:var(--wa);color:#073B1C}
.note{position:absolute;left:1.6rem;bottom:1.4rem;right:1.6rem;font-size:1.0625rem;color:var(--mute);text-align:center}

/* 5 · package */
.s5{display:grid;grid-template-columns:1fr 26rem;padding:4rem 4rem 5rem;gap:4rem}
.offer{display:flex;flex-direction:column;gap:1.4rem;min-width:0}
.price{display:flex;align-items:flex-end;gap:1.6rem;flex-wrap:wrap}
.price .v{font-family:var(--disp);font-stretch:125%;font-weight:900;font-size:13rem;line-height:.8;color:var(--blue);letter-spacing:-.04em}
.price .u{font-family:var(--disp);font-stretch:125%;font-weight:900;font-size:3rem;line-height:1;text-transform:uppercase;padding-bottom:.6rem}
.price .u small{display:block;font:500 1.375rem var(--body);text-transform:none;color:var(--mute);margin-top:.4rem}
.pk{font-size:1.5rem}
.pk b{font-family:var(--disp);font-stretch:125%;font-weight:900;text-transform:uppercase;color:var(--or)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.facts div{padding:1.3rem 1.4rem 1.3rem 0;display:flex;flex-direction:column;gap:.3rem}
.facts div+div{padding-left:1.4rem;border-left:1px solid var(--rule)}
.facts b{font-family:var(--disp);font-stretch:120%;font-weight:900;font-size:2.125rem;line-height:1}
.facts span{font-size:1.125rem;color:var(--mute)}
.ticket{display:flex;align-items:stretch;border-radius:1.3rem;overflow:hidden;background:var(--or);color:#fff;margin-top:auto;min-height:8rem}
.ticket .l b{font-size:3.5rem}
.ticket .l{padding:1.2rem 1.6rem;border-right:1px dashed rgba(255,255,255,.55);display:flex;flex-direction:column;justify-content:center;text-align:center}
.ticket .l s{font-size:1rem;opacity:.85}
.ticket .l b{font-family:var(--disp);font-stretch:125%;font-weight:900;font-size:3rem;line-height:1}
.ticket .r{padding:1.2rem 1.6rem;display:flex;flex-direction:column;justify-content:center;gap:.3rem}
.ticket .r b{font-size:1.5rem}
.ticket .r span{font-size:1.125rem;opacity:.92}
.ticket.off{background:var(--cream);color:var(--mute)}
.side{display:flex;flex-direction:column;gap:1.4rem;min-width:0}
.vs{display:flex;flex-direction:column;gap:.8rem;background:var(--cream);border-radius:1.6rem;padding:1.4rem}
.vs img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:1rem}
.vs p{font-size:1.25rem;line-height:1.4}
.vs p b{color:var(--blue)}
.plans{display:flex;flex-direction:column}
.plans button{display:flex;justify-content:space-between;align-items:baseline;border:0;border-bottom:1px solid var(--rule);background:none;padding:.9rem 0;cursor:pointer;text-align:left}
.plans button b{font-family:var(--disp);font-stretch:120%;font-weight:900;font-size:1.375rem;text-transform:uppercase}
.plans button span{font-size:1.125rem;color:var(--mute)}
.plans button[aria-pressed="true"] b{color:var(--or)}
.plans button[aria-pressed="true"] span{color:var(--ink);font-weight:700}
.fine{font-size:.9375rem;color:var(--mute)}

/* 6 · start */
.s6{display:flex;flex-direction:column}
.s6 .top{padding:4rem 4rem 0;display:flex;flex-direction:column;gap:.6rem}
.s6 h2{font-size:4rem}
.s6 h2 em{font-style:normal;color:var(--blue)}
.line{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:3rem;padding:3.2rem 4rem 0;flex:1}
.line::before{content:"";position:absolute;left:4rem;right:4rem;top:4.15rem;height:1px;background:linear-gradient(90deg,var(--or),var(--blue))}
.st{position:relative;display:flex;flex-direction:column;gap:.8rem;padding-top:2.6rem;min-width:0}
.st::before{content:"";position:absolute;left:0;top:.35rem;width:1.3rem;height:1.3rem;border-radius:50%;background:var(--paper);border:1px solid var(--or)}
.st:last-child::before{border-color:var(--blue);background:var(--blue)}
.st .w{font-size:1.25rem;font-weight:700;color:var(--or)}
.st:last-child .w{color:var(--blue)}
.st h3{font-family:var(--disp);font-stretch:125%;font-weight:900;font-size:2.5rem;line-height:1;text-transform:uppercase}
.st p{font-size:1.375rem;line-height:1.45;color:var(--mute);max-width:26rem}
.st .mk{margin-top:.6rem;max-width:22rem}
.call{display:flex;gap:.8rem;align-items:center;border:1px solid var(--rule);border-radius:1rem;padding:.7rem .9rem;font-size:1.0625rem;font-weight:700}
.call i{width:2.2rem;height:2.2rem;border-radius:50%;background:var(--blue);flex:none}
.call small{display:block;font-weight:400;color:var(--mute);font-size:.9375rem}
.s6 .ping{border:1px solid var(--rule)}
.s6 .bub.out{margin:0}
.band{background:var(--blue);color:#fff;margin:0 4rem 4.4rem;border-radius:2rem;padding:2rem 2.4rem;display:flex;justify-content:space-between;align-items:center;gap:2rem;position:relative}
.band h2 em{font-style:normal;color:#FFB487}
.band .btn{background:#fff;color:var(--blue);display:inline-flex;align-items:center;gap:.7rem}
.band .btn::before{content:"";width:.8rem;height:.8rem;border-radius:50%;background:var(--wa)}
.band .toast{color:#FFD9C2}
.band h2{font-size:3.25rem}
.band p{font-size:1.25rem;opacity:.75;margin-top:.5rem}

.btn{border:0;border-radius:999px;padding:1.2rem 2.2rem;font-weight:700;font-size:1.375rem;cursor:pointer;background:var(--wa);color:#073B1C;white-space:nowrap}

/* lock slide */
.s7{display:grid;grid-template-columns:1fr 34rem;padding:4rem 4rem 5rem;gap:4rem}
.s7 h2{font-size:4rem}
.s7 h2 em{font-style:normal;color:var(--blue)}
.pick{display:flex;flex-direction:column;gap:1.4rem;min-width:0}
.pkrow{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem}
.pkrow button{border:1px solid var(--rule);background:var(--paper);border-radius:1.2rem;padding:1.1rem;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:.3rem}
.pkrow button b{font-family:var(--disp);font-stretch:120%;font-weight:900;font-size:1.375rem;text-transform:uppercase}
.pkrow button span{font-size:1.125rem;color:var(--mute)}
.pkrow button em{font-style:normal;font-size:.875rem;font-weight:700;color:var(--or)}
.pkrow button[aria-pressed="true"]{border:1px solid var(--blue);background:#F4F2FF}
.pkrow button[disabled]{opacity:.45;cursor:default}
.keeps{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.keeps div{display:flex;justify-content:space-between;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--rule);font-size:1.625rem}
.pkrow button{padding:1.4rem 1.2rem!important}
.pkrow button b{font-size:1.625rem!important}
.pkrow button span{font-size:1.25rem!important}
.cd{display:flex;gap:.6rem;margin-top:.4rem}
.cd div{flex:1;background:rgba(255,255,255,.1);border-radius:1rem;padding:.9rem .5rem;text-align:center}
.cd b{display:block;font-family:var(--disp);font-stretch:125%;font-weight:900;font-size:3.5rem;line-height:1}
.cd span{font-size:.875rem;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.keeps div b{font-weight:700}
.keeps div span{color:var(--mute)}
.lockcard{border-radius:2rem;background:var(--ink);color:#fff;padding:2.2rem;display:flex;flex-direction:column;gap:1.2rem;position:relative;overflow:hidden}
.lockcard .k{font-size:.875rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#FFB487}
.lockcard .pn{font-family:var(--disp);font-stretch:112%;font-weight:900;font-size:3.5rem;line-height:.95;text-transform:uppercase;overflow-wrap:anywhere}
.lead{font-size:1.375rem;line-height:1.45;color:var(--mute);margin-top:1rem;max-width:44rem}
.keeps .kh{font-size:.875rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--or);padding:1rem 0 .2rem}
.ticks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.55rem;font-size:1.125rem}
.ticks li{display:flex;gap:.6rem}
.ticks li::before{content:"✓";color:#FFB487;font-weight:900}
.lockcard.done .ticks li::before{color:#fff}
.lockcard .pp{font-size:1.5rem;opacity:.85}
.lockcard .until{font-size:1.25rem;line-height:1.4;opacity:.85}
.lockcard .until b{color:#FFB487;opacity:1}

function chrome(){document.documentElement.lang=S.lang==="bm"?"ms":S.lang;$("langbox").innerHTML=langSwitch();
  $("dots").innerHTML=t("titles").map(function(x,i){return '<button type="button" data-go="'+i+'"'+(i===S.i?' aria-current="true"':'')+'>'+x+'</button>'}).join("");
  $("prev").setAttribute("aria-label",t("prev"));$("next").setAttribute("aria-label",t("next"));nav();}
function build(){
  $("stage").innerHTML=SL.map(function(f,i){return '<section class="slide'+(i===S.i?' on':'')+'">'+f()+'</section>'}).join("");chrome();
}
function redraw(skip){Array.prototype.forEach.call($("stage").children,function(sec,i){if(i!==skip)sec.innerHTML=SL[i]();});}
function nav(){var c=$("count");if(c)c.textContent=(S.i+1)+" / "+SL.length+" · "+t("titles")[S.i];$("prev").disabled=S.i===0;$("next").disabled=S.i===SL.length-1;}
function go(n){n=Math.max(0,Math.min(SL.length-1,n));if(n===S.i)return;S.i=n;
  Array.prototype.forEach.call($("stage").children,function(s,i){s.classList.toggle("on",i===n)});
  Array.prototype.forEach.call($("dots").children,function(b,i){if(i===n)b.setAttribute("aria-current","true");else b.removeAttribute("aria-current")});nav();document.querySelector(".viewport").scrollTop=0;}
function setLang(l){if(!T[l]||l===S.lang)return;S.lang=l;try{localStorage.setItem("dms-lang",l);}catch(e){}redraw();chrome();if($("cust").classList.contains("on"))custView();}
var MOB=window.matchMedia("(max-width:53.75em)");
function fit(){var v=document.querySelector(".viewport");if(MOB.matches){var st0=$("stage");st0.style.transform="";st0.style.width="";st0.style.height="";return;}var W=v.clientWidth,H=v.clientHeight,a=W/H,sw=a>=16/9?900*a:1600,sh=a>=16/9?900:1600/a,st=$("stage");st.style.width=sw+"px";st.style.height=sh+"px";st.style.transform="scale("+(W/sw)+")";}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  if(b.dataset.lang)return setLang(b.dataset.lang);
  if(b.dataset.go)return go(+b.dataset.go);
  if(b.id==="next")return go(S.i+1); if(b.id==="prev")return go(S.i-1);
  if(b.dataset.ind){S.ind=b.dataset.ind;S.story=b.dataset.story;redraw(0);setTimeout(function(){go(1)},200);return;}
  if(b.dataset.k){S[b.dataset.k]=b.dataset.v;redraw();return;}
  if(b.dataset.plan){S.plan=+b.dataset.plan;redraw();return;}
  if(b.id==="lock"&&!S.locked){S.locked=Date.now();redraw();return;}
  if(b.id==="wa"){if(!S.locked){S.locked=Date.now();redraw();}window.open("https://wa.me/?text="+encodeURIComponent(summary()),"_blank");return;}
  if(b.id==="copy"){var tx=summary();var done=function(){var el=$("toast");if(el)el.textContent=t("copied");};try{navigator.clipboard.writeText(tx).then(done,function(){prompt(t("copyp"),tx);});}catch(err){prompt(t("copyp"),tx);}return;}
  if(b.id==="cust-close"){$("cust").classList.remove("on");return;}
});
document.addEventListener("input",function(e){var el=e.target;if(el.id!=="biz"&&el.id!=="sell")return;S[el.id]=el.value;var b=S.biz||t("defbiz");
  $("ad-biz").textContent=b;$("ad-biz2").textContent=b;$("ad-text").textContent=t("ptext",{b:b});$("ad-hook").textContent=hook();redraw(3);});
document.addEventListener("keydown",function(e){if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight"||e.key==="PageDown")go(S.i+1);if(e.key==="ArrowLeft"||e.key==="PageUp")go(S.i-1);});
window.addEventListener("resize",fit);
custView();build();fit();
/* desktop: one wheel/trackpad swipe = one slide (momentum ignored); touch: horizontal swipe changes slide */
(function(){var lastT=0,lastDir=0,lockUntil=0,hist=[];
 document.querySelector(".viewport").addEventListener("wheel",function(e){
  if(MOB.matches||$("cust").classList.contains("on"))return;
  var d=Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX; if(Math.abs(d)<2)return; e.preventDefault();
  var now=Date.now(),dir=d>0?1:-1,gap=now-lastT,avg=hist.length?hist.reduce(function(a,b){return a+b},0)/hist.length:0;
  var fresh=gap>160||dir!==lastDir||(avg&&Math.abs(d)>avg*1.35&&gap>40);
  lastT=now;lastDir=dir;hist.push(Math.abs(d));if(hist.length>5)hist.shift();
  if(now<lockUntil||!fresh){if(fresh)hist=[Math.abs(d)];return;}
  hist=[Math.abs(d)];lockUntil=now+420;go(S.i+dir);
 },{passive:false});
 var sx0=0,sy0=0,st=0;
 document.addEventListener("touchstart",function(e){if(e.target.closest&&e.target.closest("input"))return;var p=e.touches[0];sx0=p.clientX;sy0=p.clientY;st=Date.now();},{passive:true});
 document.addEventListener("touchend",function(e){if(!st||$("cust").classList.contains("on"))return;var p=e.changedTouches[0],dx=p.clientX-sx0,dy=p.clientY-sy0;
  if(Date.now()-st<700&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(S.i+(dx<0?1:-1));st=0;},{passive:true});
})();

window.addEventListener("hashchange",function(){custView();redraw();chrome();});
