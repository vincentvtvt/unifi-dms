<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMS Presentation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
:root{
  /* Light theme follows biz.unifi.com.my (see the override block at the end). Original dark palette: Dark Blue #06013A, Cobalt #1800E7/#1400DD, Light Blue #99B6FF, Orange #FF5E00/#EC692C, Light Orange #F7B986.
     Layout: five 16:9 slides designed at 1600x900 and scaled to fit the window, for screen sharing. */
  --bg:#06013A; --ink:#FFFFFF; --muted:#99B6FF; --line:rgba(153,182,255,.2); --glass:rgba(153,182,255,.07);
  --cobalt:#1800E7; --blue2:#1400DD; --lb:#99B6FF; --or:#FF5E00; --or2:#EC692C; --lo:#F7B986;
  --display:'Archivo','Noto Sans SC',Arial,sans-serif; --body:'Roboto','Noto Sans SC',Arial,sans-serif; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#06013A;color:var(--ink);font-family:var(--body)}
h1,h2,h3,p,ul,ol{margin:0}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--lb);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:fixed;left:0;right:0;top:0;height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(6,1,58,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:10}
.logo{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:20px;text-shadow:0 0 14px rgba(153,182,255,.9)}
.tabs{flex:1;display:flex;gap:6px;justify-content:center;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--glass);color:var(--muted);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.tabs button[aria-current="true"]{background:var(--cobalt);border-color:var(--lb);color:#fff;box-shadow:0 0 14px rgba(24,0,231,.9)}
.tabs button span{opacity:.6;margin-right:5px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:700;padding:7px 9px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--cobalt);color:#fff}
.icon-btn{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--cobalt),var(--lb),var(--or));box-shadow:0 0 10px var(--or);transition:width .5s}

/* stage */
.viewport{position:fixed;left:0;right:0;top:52px;bottom:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.viewport::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 500px at 85% 0%,rgba(24,0,231,.5),transparent 60%),radial-gradient(700px 420px at 5% 100%,rgba(236,105,44,.22),transparent 60%);pointer-events:none}
.viewport::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(153,182,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(153,182,255,.05) 1px,transparent 1px);background-size:44px 44px}
.stage{width:1600px;height:900px;position:relative;flex:none;transform-origin:center center;z-index:1}
.slide{position:absolute;inset:0;padding:40px 52px 34px;display:flex;flex-direction:column;gap:22px;opacity:0;visibility:hidden;transform:translateX(40px);transition:opacity .5s,transform .6s cubic-bezier(.2,.7,.2,1),visibility .5s}
.slide.on{opacity:1;visibility:visible;transform:none}
.slide.back{transform:translateX(-40px)}
.slide .rv{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .7s cubic-bezier(.2,.7,.2,1)}
.slide.on .rv{opacity:1;transform:none}
.slide.on .rv:nth-child(2){transition-delay:.08s}.slide.on .rv:nth-child(3){transition-delay:.16s}.slide.on .rv:nth-child(4){transition-delay:.24s}
.navbtns{position:fixed;right:16px;bottom:14px;display:flex;gap:8px;z-index:11}
.navbtns button{border:1px solid var(--line);background:rgba(6,1,58,.8);border-radius:999px;width:46px;height:46px;font-size:20px;cursor:pointer;color:#fff}
.navbtns button.next{background:linear-gradient(135deg,var(--cobalt),var(--blue2));border-color:var(--lb);box-shadow:0 0 18px rgba(24,0,231,.8)}
.navbtns button[disabled]{opacity:.35;cursor:default}

/* shared */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.eyebrow{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:15px;letter-spacing:3px;text-transform:uppercase;color:var(--lo)}
.h{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:52px;line-height:1;text-transform:uppercase;letter-spacing:-.5px}
.h.grad{background:linear-gradient(90deg,#fff,var(--lb) 55%,var(--lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.snum{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:120px;line-height:.8;color:transparent;-webkit-text-stroke:1.5px rgba(153,182,255,.4)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:22px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:relative;overflow:hidden}
.card h3{font-family:var(--display);font-stretch:120%;font-weight:900;font-size:20px;text-transform:uppercase;letter-spacing:.3px;margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:14px;color:var(--muted)}
.grid{display:grid;gap:18px;flex:1;min-height:0}
.ticks{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px;font-size:19px}
.ticks li{display:flex;gap:12px;align-items:flex-start}
.ticks li::before{content:"✓";color:var(--or);font-weight:900;text-shadow:0 0 10px rgba(255,94,0,.8)}
.nums{list-style:none;padding:0;display:flex;flex-direction:column;gap:12px;font-size:18px;counter-reset:n}
.nums li{counter-increment:n;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center}
.nums li::before{content:counter(n);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;background:var(--or);color:#06013A;box-shadow:0 0 12px rgba(255,94,0,.7)}
.nums.blue li::before{background:#fff;color:var(--blue2);box-shadow:0 0 12px rgba(153,182,255,.8)}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chipset span{border:1px solid var(--line);background:rgba(153,182,255,.1);border-radius:999px;padding:7px 13px;font-size:15px;font-weight:700}
.btn{border:0;border-radius:999px;padding:14px 22px;font-weight:700;font-size:18px;cursor:pointer;background:linear-gradient(135deg,var(--cobalt),var(--blue2));color:#fff;box-shadow:0 0 0 1px rgba(153,182,255,.4),0 10px 30px -10px rgba(24,0,231,.9)}
.btn.or{background:linear-gradient(135deg,var(--or2),var(--or));color:#06013A;box-shadow:0 0 0 1px rgba(255,94,0,.5),0 10px 30px -8px rgba(255,94,0,.8)}
.btn.ghost{background:transparent;color:var(--lb);box-shadow:none;border:1px solid rgba(153,182,255,.5)}
table{width:100%;border-collapse:collapse;font-size:18px}
td{padding:9px 0;border-top:1px solid var(--line)}
td:last-child{text-align:right;font-weight:700;white-space:nowrap}
tr.tot td{border-top:2px solid var(--lb);font-size:21px}

/* slide 1 */
.s1{grid-template-columns:1.25fr 1fr;grid-template-rows:auto 1fr}
.hero1{grid-column:1/3;display:flex;flex-direction:column;gap:12px}
.hero1 .h{font-size:76px;max-width:16ch}
.hero1 p{font-size:22px;color:var(--muted);max-width:60ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat{background:var(--glass);border:1px solid var(--line);border-top:3px solid var(--or);border-radius:20px;padding:18px}
.stat b{display:block;font-family:var(--display);font-stretch:125%;font-weight:900;font-size:54px;line-height:1;text-shadow:0 0 24px rgba(153,182,255,.7)}
.stat span{color:var(--muted);font-size:16px}
.agenda{display:flex;gap:10px;margin-top:14px}
.agenda button{flex:1;border:1px solid var(--line);background:var(--glass);border-radius:16px;padding:12px;text-align:left;cursor:pointer}
.agenda b{display:block;font-family:var(--display);font-weight:900;color:var(--or);font-size:22px}
.agenda span{font-size:14px;font-weight:700}

/* slide 2 */
.s2{grid-template-columns:1fr 1fr;grid-template-rows:1fr auto}
.we{background:linear-gradient(160deg,rgba(24,0,231,.85),rgba(20,0,221,.5));border-color:rgba(153,182,255,.45);box-shadow:0 10px 40px -10px rgba(24,0,231,.8)}
.team{display:flex;gap:10px;margin-bottom:16px}
.team div{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:10px;text-align:center;font-weight:700;font-size:15px}
.team div i{display:block;font-style:normal;font-size:26px;margin-bottom:2px}
.tl{grid-column:1/3}
.tl-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;position:relative}
.tl-row::before{content:"";position:absolute;left:3%;right:3%;top:17px;height:3px;background:linear-gradient(90deg,var(--or),var(--lb),var(--cobalt));box-shadow:0 0 10px rgba(255,94,0,.6)}
.tl-row div{position:relative;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}
.tl-row div::before{content:"";width:22px;height:22px;border-radius:50%;background:#06013A;border:3px solid var(--or);margin:6px 0 8px;box-shadow:0 0 12px rgba(255,94,0,.8)}
.tl-row b{font-family:var(--display);font-stretch:110%;font-size:17px}
.tl-row span{font-size:14px;color:var(--lo);font-weight:700}

/* slide 3 */
.s3{grid-template-columns:1.05fr 1fr}
.kk{display:flex;flex-direction:column;gap:14px}
.kk-top{display:flex;gap:16px;align-items:center}
.kk-top img{width:230px;aspect-ratio:16/9;object-fit:cover;border-radius:12px;cursor:zoom-in;border:1px solid var(--line)}
.kk-res{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:64px;line-height:1;color:var(--or);text-shadow:0 0 34px rgba(255,94,0,.6)}
.bars{display:flex;flex-direction:column;gap:10px}
.br{display:grid;grid-template-columns:170px 1fr 90px;gap:12px;align-items:center;font-size:16px;color:var(--muted)}
.br .tr{height:16px;border-radius:8px;background:rgba(153,182,255,.12);overflow:hidden}
.br .fl{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--cobalt),var(--lb));transition:width 1.2s cubic-bezier(.2,.7,.2,1)}
.br.or .fl{background:linear-gradient(90deg,var(--or2),var(--or));box-shadow:0 0 12px rgba(255,94,0,.8)}
.br b{text-align:right;font-family:var(--display);font-weight:900;color:#fff;font-size:19px}
.kk-mini{display:grid;grid-template-columns:1.7fr 1fr;gap:12px}
.kk-mini div{background:rgba(153,182,255,.08);border-radius:14px;padding:12px}
.kk-mini b{font-family:var(--display);font-stretch:120%;font-weight:900;font-size:30px;display:block}
.others{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.oc{display:grid;grid-template-columns:124px 1fr;gap:12px;align-items:center;background:rgba(153,182,255,.06);border:1px solid var(--line);border-radius:14px;padding:8px;cursor:zoom-in;text-align:left}
.oc img{width:124px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block}
.oc b{display:block;font-size:15px;line-height:1.25}
.oc small{font-size:12px;color:var(--lo);font-weight:700}
.oc span{font-size:12px;color:var(--muted)}

/* slide 4 */
.s4{grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto 1fr}
.plans{grid-column:1/4;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.pc{border:2px solid var(--line);background:var(--glass);border-radius:20px;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column;padding:0;transition:transform .25s,box-shadow .25s,border-color .25s}
.pc:hover{transform:translateY(-3px)}
.pc[aria-pressed="true"]{border-color:var(--lb);box-shadow:0 0 0 1px var(--lb),0 0 36px -6px rgba(153,182,255,.8)}
.pc .lab{font-size:14px;font-weight:700;padding:6px 14px;min-height:30px;color:#fff}
.pc .lab.aw{background:linear-gradient(90deg,var(--or2),var(--cobalt))}
.pc .lab.bv{background:linear-gradient(90deg,#CA401F,var(--or2))}
.pc .lab.none{background:rgba(153,182,255,.08)}
.pc .in{padding:12px 16px 14px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.pc .nm{font-family:var(--display);font-stretch:120%;font-weight:900;font-size:24px;text-transform:uppercase}
.pc .pr{font-family:var(--display);font-stretch:115%;font-weight:900;font-size:34px;color:var(--or);text-shadow:0 0 18px rgba(255,94,0,.45)}
.pc .pr small{font-size:15px;color:var(--muted);text-shadow:none}
.pc .bon{margin:0 16px 14px;font-size:13px;font-weight:700;border-radius:8px;padding:5px 9px;align-self:flex-start;background:var(--or);color:#06013A}
.pc .bon.no{background:rgba(153,182,255,.1);color:var(--muted);font-weight:500}
.split{display:flex;height:18px;border-radius:9px;overflow:hidden;margin:14px 0 8px}
.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:middle}
.big{font-family:var(--display);font-stretch:120%;font-weight:900;font-size:56px;color:var(--or);text-shadow:0 0 28px rgba(255,94,0,.55);line-height:1}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.pills button{border:1px solid var(--line);background:rgba(153,182,255,.08);border-radius:999px;padding:8px 13px;font-size:15px;font-weight:700;cursor:pointer}
.pills button[aria-pressed="true"]{background:var(--cobalt);border-color:var(--lb);box-shadow:0 0 14px rgba(24,0,231,.8)}
.est{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.est div{background:rgba(153,182,255,.08);border-radius:14px;padding:12px}
.est b{display:block;font-family:var(--display);font-stretch:110%;font-weight:900;font-size:26px}
.bills{display:flex;align-items:flex-end;gap:5px;height:80px;margin:8px 0 6px}
.bills i{flex:1;background:rgba(153,182,255,.18);border-radius:5px 5px 2px 2px;height:45%}
.bills i.first{background:var(--or);height:90%;box-shadow:0 0 14px rgba(255,94,0,.7)}

/* slide 5 */
.s5{grid-template-columns:1fr 1.15fr}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rules div{background:rgba(153,182,255,.07);border:1px solid var(--line);border-radius:14px;padding:12px}
.rules b{display:block;font-family:var(--display);font-stretch:110%;font-weight:900;font-size:17px}
.rules span{font-size:14px;color:var(--muted)}
.close{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sum{background:linear-gradient(160deg,rgba(24,0,231,.85),rgba(20,0,221,.5));border-color:rgba(153,182,255,.45)}
.sum td{font-size:17px}
.deal{background:linear-gradient(110deg,#CA401F,var(--or2));border:0;box-shadow:0 20px 60px -25px rgba(255,94,0,.9);display:flex;flex-direction:column;gap:10px}
.deal .tag{font-family:var(--display);font-stretch:120%;font-weight:900;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#06013A}
.deal h3{margin:0;font-size:24px;line-height:1.1}
.deal p{font-size:15px}
.count{display:flex;gap:8px}
.count div{flex:1;background:rgba(6,1,58,.55);border:1px solid rgba(255,255,255,.35);border-radius:12px;padding:8px;text-align:center}
.count b{display:block;font-family:var(--display);font-weight:900;font-size:30px}
.count span{font-size:12px;color:var(--lo)}
.gift{display:flex;gap:8px;flex-wrap:wrap}
.gift button{border:2px solid #fff;background:transparent;border-radius:999px;padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer}
.gift button[aria-pressed="true"]{background:#fff;color:var(--blue2)}
.gift button[disabled]{opacity:.5;cursor:default}
.fine{font-size:12px;opacity:.9}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toast{font-size:15px;color:var(--lo)}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(6,1,58,.94);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
.lb img{max-width:min(1200px,96vw);max-height:84vh;border-radius:12px}
[hidden]{display:none!important}

/* phones: stop scaling, stack and scroll instead */
@media (max-width:860px){
  html,body{overflow:auto;height:auto}
  .viewport{position:static;display:block;padding-top:52px}
  .stage{width:auto;height:auto;transform:none!important}
  .slide{position:static;padding:22px 16px 90px;transform:none!important}
  .slide:not(.on){display:none}
  .grid,.s1,.s2,.s3,.s4,.s5,.close,.plans,.stats,.others,.rules,.est,.kk-mini{grid-template-columns:1fr!important;grid-template-rows:auto!important}
  .plans{grid-template-columns:1fr 1fr!important}
  .hero1,.tl,.plans{grid-column:auto!important}
  .hero1 .h{font-size:40px}.h{font-size:32px}.snum{display:none}
  .tl-row{grid-template-columns:1fr 1fr 1fr}.tl-row::before{display:none}
  .agenda{flex-wrap:wrap}.agenda button{flex:1 1 40%}
  .br{grid-template-columns:110px 1fr 70px}
  .tabs{justify-content:flex-start}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ===== Light theme from biz.unifi.com.my: white, blue #1400DD, orange #EC692C, peach #FCF0E4 / #FCF5EF, text #121725 ===== */
:root{--ink:#121725;--muted:rgba(18,23,37,.72);--line:#FCF0E4;--glass:#FCF5EF;--cobalt:#1400DD;--blue2:#1400DD;--lb:#1400DD;--or:#EC692C;--or2:#EC692C;--lo:#EC692C;color-scheme:light}
html,body{background:#FFFFFF;color:#121725}
.viewport::before,.viewport::after{display:none}
.bar{background:#FFFFFF;backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:0;box-shadow:0 2px 8px rgba(18,23,37,.08)}
.logo{color:#1400DD;text-shadow:none}
.tabs button{background:#FCF0E4;border-color:#FCF0E4;color:#121725}
.tabs button[aria-current="true"]{background:#1400DD;border-color:#1400DD;color:#FFFFFF;box-shadow:none}
.lang{border-color:#FCF0E4;background:#FCF0E4}
.lang button{color:#121725}
.lang button[aria-pressed="true"]{background:#1400DD;color:#FFFFFF}
.icon-btn{background:#FCF0E4;border-color:#FCF0E4;color:#121725}
.progress{background:#EC692C;box-shadow:none}
.eyebrow{color:#EC692C}
.h{color:#121725}
.h.grad{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:#1400DD}
.snum{-webkit-text-stroke:1.5px #F1A270}
.card{background:#FCF5EF;border:0;backdrop-filter:none;-webkit-backdrop-filter:none}
.card h3{color:#121725}
.ticks li::before{color:#EC692C;text-shadow:none}
.nums li::before{background:#EC692C;color:#FFFFFF;box-shadow:none}
.nums.blue li::before{background:#FFFFFF;color:#1400DD;box-shadow:none}
.chipset span{background:#FFFFFF;border-color:#FCF0E4;color:#121725}
.stat{background:#FCF5EF;border:0;border-top:4px solid #EC692C}
.stat b{color:#1400DD;text-shadow:none}
.agenda button{background:#FFFFFF;border-color:#FCF0E4;color:#121725}
.agenda b{color:#EC692C}
.we{background:#1400DD;border:0;box-shadow:none;color:#FFFFFF}
.we h3{color:#FFFFFF}
.team div{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#FFFFFF}
.tl-row::before{background:linear-gradient(90deg,#EC692C,#1400DD);box-shadow:none}
.tl-row div::before{background:#FFFFFF;border-color:#EC692C;box-shadow:none}
.tl-row span{color:#EC692C}
.kk-top img,.oc{border-color:#FCF0E4}
.kk-res{color:#EC692C;text-shadow:none}
.br{color:rgba(18,23,37,.72)}
.br .tr{background:#FFFFFF}
.br .fl{background:#1400DD}
.br.or .fl{background:#EC692C;box-shadow:none}
.br b{color:#121725}
.kk-mini div{background:#FFFFFF}
.oc{background:#FFFFFF}
.oc small{color:#EC692C}
.pc{background:#FCF5EF;border-color:#FCF5EF}
.pc[aria-pressed="true"]{border-color:#1400DD;box-shadow:none}
.pc .lab{color:#FFFFFF}
.pc .lab.aw{background:linear-gradient(90deg,#E3642C,#1B04D5)}
.pc .lab.bv{background:linear-gradient(90deg,#CA401F,#EC692C)}

  if(p.bon && !ended()){var it=t.items.filter(function(x){return x[0]===state.pick;})[0]; L.push(t.s[4]+": "+it[1]+", "+(p.bon===1?t.free1:t.free2)+" ("+fmtDT(deadline())+")");}
  return L.join("\n");}

function render(){
  var t=T[state.lang], p=PLANS[state.plan], bill=p.tot/12, sst=p.tot-p.cr-p.fee;
  document.documentElement.lang=state.lang==="zh"?"zh-Hans":(state.lang==="bm"?"ms":"en");
  document.querySelectorAll("[data-i]").forEach(function(n){var k=n.getAttribute("data-i"); if(t[k]!=null) n.textContent=t[k];});
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.lang===state.lang));});
  fill("tabs",t.tabs,function(x,i){var b=el("button"); b.type="button"; b.setAttribute("role","tab"); b.setAttribute("aria-current",String(i===state.s)); b.appendChild(el("span","0"+(i+1))); b.appendChild(document.createTextNode(x)); b.addEventListener("click",function(){go(i);}); return b;});
  $("progress").style.width=((state.s+1)/5*100)+"%"; $("prev").disabled=state.s===0; $("next").disabled=state.s===4;
  // 1
  fill("facts",t.facts,function(x){return el("li",x);}); fill("plats",t.plats,function(x){return el("span",x);});
  fill("agenda",t.tabs,function(x,i){var b=el("button"); b.type="button"; b.appendChild(el("b","0"+(i+1))); b.appendChild(el("span",x)); b.addEventListener("click",function(){go(i);}); return b;});
  // 2
  fill("team",t.team,function(x,i){var d=el("div"); d.appendChild(el("i",["◎","✎","◆"][i])); d.appendChild(document.createTextNode(x)); return d;});
  fill("we",t.we,function(x){return el("li",x);}); fill("you",t.you,function(x){return el("li",x);});
  fill("tl",t.tl,function(x){var d=el("div"); d.appendChild(el("b",x[0])); d.appendChild(el("span",x[1].replace("{c}",fmtD(addWD(3))).replace("{l}",fmtD(addWD(9))))); return d;});
  // 3
  renderStories(t);
  // 4
  fill("plans",PLANS,function(q,i){var b=el("button",null,"pc"); b.type="button"; b.setAttribute("aria-pressed",String(i===state.plan));
    b.appendChild(el("span",q.lab?t[q.lab]:"","lab "+(q.lab||"none")));
    var inn=el("div",null,"in"); inn.appendChild(el("span",q.id,"nm")); var pr=el("span","RM"+q.p,"pr num"); pr.appendChild(el("small",t.mo)); inn.appendChild(pr); b.appendChild(inn);
    b.appendChild(el("span",q.bon===2?t.bon2:(q.bon===1?t.bon1:t.bon0),q.bon?"bon":"bon no"));
    b.addEventListener("click",function(){state.plan=i; render();}); return b;});
  $("give-t").textContent=t.give_t.replace("{p}",p.id);
  fill("give",[[t.g[0],rm(p.cr)],[t.g[1],rm(bill)],[t.g[2],rm(bill*2)],[t.g[3],rm(p.tot)]],function(r,i){var tr=el("tr",null,i===3?"tot":""); tr.appendChild(el("td",r[0])); tr.appendChild(el("td",r[1])); return tr;});
  var segs=[[p.cr,"#EC692C"],[p.fee,"#1400DD"],[sst,"#F1A270"]];
  fill("split",segs,function(sg){var i=el("i"); i.style.width=(sg[0]/p.tot*100)+"%"; i.style.background=sg[1]; return i;});
  fill("legend",segs,function(sg,i){var s=el("span"); var k=el("i"); k.style.background=sg[1]; s.appendChild(k); s.appendChild(document.createTextNode(t.seg[i]+" "+rm(sg[0]))); return s;});
  fill("estp",t.estp,function(x,i){var b=el("button",x); b.type="button"; b.setAttribute("aria-pressed",String(i===state.plat)); b.addEventListener("click",function(){state.plat=i; render();}); return b;});
  var bn=BENCH[state.plat]; $("e-imp").textContent=bn.cpm? nice(p.cr/bn.cpm[1]*1000)+" – "+nice(p.cr/bn.cpm[0]*1000) : t.na; $("e-clk").textContent=nice(p.cr/bn.cpc[1])+" – "+nice(p.cr/bn.cpc[0]);
  var bh=$("bills"); if(!bh.childNodes.length){ for(var k=0;k<11;k++) bh.appendChild(el("i",null,k===0?"first":"")); }
  fill("pay",t.pay,function(x){return el("li",x);}); fill("opt",t.opt,function(x){return el("li",x);});
  // 5
  fill("rules",t.rules,function(r){var d=el("div"); d.appendChild(el("b",r[0])); d.appendChild(el("span",r[1])); return d;});
  $("sum-t").textContent=t.sum_t.replace("{p}",p.id).replace("{m}",p.p);
  var it=t.items.filter(function(x){return x[0]===state.pick;})[0];
  var bonus = (!p.bon||ended()) ? t.none : it[1]+" · "+(p.bon===1?t.free1:t.free2);
  fill("sum",[[t.s[0],rm(p.cr)],[t.s[1],rm(bill)],[t.s[2],rm(bill*2)],[t.s[4],bonus],[t.s[5],fmtD(addWD(9))],[t.s[3],rm(p.tot)]],function(r,i){var tr=el("tr",null,i===5?"tot":""); tr.appendChild(el("td",r[0])); var td=el("td",r[1]); if(i===3) td.style.whiteSpace="normal"; tr.appendChild(td); return tr;});
  deal(t,p);
  $("confirm").textContent=t.confirm.replace("{p}",p.id);
  $("mk").hidden = location.hash!=="#consultant";
}
function bar(label,frac,val,cls,narrow){var r=el("div",null,"br"+(cls?" "+cls:"")); if(narrow) r.style.gridTemplateColumns="90px 1fr 70px"; r.appendChild(el("span",label)); var tr=el("div",null,"tr"), fl=el("div",null,"fl"); fl.dataset.w=(frac*100)+"%"; tr.appendChild(fl); r.appendChild(tr); r.appendChild(el("b",val)); return r;}
var STATE_STORY={cat:"all",id:"mog"};
function renderStories(t){
  fill("cats",t.cats,function(c){var n=c[0]==="all"?STORIES.length:STORIES.filter(function(x){return x.cat===c[0];}).length;
    var b=el("button",c[1]+" ("+n+")"); b.type="button"; b.setAttribute("aria-pressed",String(STATE_STORY.cat===c[0]));
    b.addEventListener("click",function(){STATE_STORY.cat=c[0]; var first=STORIES.filter(function(x){return c[0]==="all"||x.cat===c[0];})[0]; if(first) STATE_STORY.id=first.id; renderStories(T[state.lang]);}); return b;});
  var list=STORIES.filter(function(x){return STATE_STORY.cat==="all"||x.cat===STATE_STORY.cat;});
  fill("plist",list,function(x){var b=el("button",null,"pi"); b.type="button"; b.setAttribute("aria-pressed",String(x.id===STATE_STORY.id));
    var im=el("img"); im.src="/dms-pitch-n2m6mbss/stories/"+x.img; im.alt=""; im.loading="lazy"; b.appendChild(im);
    var d=el("div"); d.appendChild(el("small",x.plan==="Starter"?t.starter:x.plan)); d.appendChild(el("b",x.h[state.lang])); d.appendChild(el("span",x.who.split(" · ").pop())); b.appendChild(d);
    b.addEventListener("click",function(){STATE_STORY.id=x.id; renderStories(T[state.lang]);}); return b;});
  var cur=STORIES.filter(function(x){return x.id===STATE_STORY.id;})[0]||list[0];
  var img=$("v-img"); if(img.getAttribute("data-id")!==cur.id){ var body=$("v-body"); body.classList.remove("swap"); img.classList.remove("swap"); void body.offsetWidth; body.classList.add("swap"); img.classList.add("swap"); }
  img.src="/dms-pitch-n2m6mbss/stories/"+cur.img; img.alt=cur.who+": "+cur.h.en; img.setAttribute("data-id",cur.id);
  $("v-plan").textContent=cur.plan==="Starter"?t.starter:("DMS "+cur.plan);
  $("v-cat").textContent=(t.cats.filter(function(c){return c[0]===cur.cat;})[0]||["",""])[1];
  $("v-h").textContent=cur.h[state.lang]; $("v-who").textContent=cur.who; $("v-d").textContent=cur.d[state.lang];
  var met=$("v-met"); met.textContent=""; if(cur.m){ cur.m.forEach(function(v,i){var d=el("div"); d.appendChild(el("b",v)); d.appendChild(el("span",t.kb[i])); met.appendChild(d);}); }
}
function growBars(){ if(state.s!==2) return; document.querySelectorAll('.slide[data-s="2"] .fl').forEach(function(f){ f.style.width="0"; requestAnimationFrame(function(){requestAnimationFrame(function(){ f.style.width=f.dataset.w; });}); }); }
function deal(t,p){var box=$("deal"); box.textContent=""; box.appendChild(el("span",t.d_tag,"tag"));
  if(ended()){ box.appendChild(el("h3",t.ended)); return; }
  box.appendChild(el("h3",t.d_h)); box.appendChild(el("p",t.d_p));
  var dl=deadline(), ms=dl-new Date(), c=el("div",null,"count num");
  [[Math.floor(ms/864e5),t.dd],[Math.floor(ms%864e5/36e5),t.hh],[Math.floor(ms%36e5/6e4),t.mm]].forEach(function(x){var d=el("div"); d.appendChild(el("b",String(x[0]))); d.appendChild(el("span",x[1])); c.appendChild(d);});
  box.appendChild(el("p",t.ends+" · "+fmtDT(dl),"fine")); box.appendChild(c);
  if(!p.bon){ box.appendChild(el("p",t.d_none)); var g0=el("div",null,"gift"), u=el("button",t.d_up); u.type="button"; u.setAttribute("aria-pressed","true"); u.addEventListener("click",function(){state.plan=1; render();}); g0.appendChild(u); box.appendChild(g0); }
  else { box.appendChild(el("p",t.d_gift)); var g=el("div",null,"gift");
    t.items.forEach(function(it){var b=el("button",it[1]+" · "+(p.bon===1?t.free1:t.free2)); b.type="button"; b.setAttribute("aria-pressed",String(state.pick===it[0])); if(it[0]==="q4u") b.title=t.fnb;
      b.addEventListener("click",function(){state.pick=it[0]; render();}); g.appendChild(b);}); box.appendChild(g); }
  box.appendChild(el("p",t.by,"fine"));
}
function countStats(){ if(state.s!==0||matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  document.querySelectorAll(".stat b[data-count]").forEach(function(b){ var to=+b.dataset.count, post=b.dataset.post||"", t0=null; if(to===2023) return;
    (function f(ts){ if(ts){ if(!t0) t0=ts; var k=Math.min(1,(ts-t0)/1300), v=Math.round(to*(1-Math.pow(1-k,3))); b.textContent=v.toLocaleString("en-MY")+post; if(k<1) requestAnimationFrame(f);} else requestAnimationFrame(f); })(); }); }
function go(i){ i=Math.max(0,Math.min(4,i)); var prev=state.s; state.s=i;
  document.querySelectorAll(".slide").forEach(function(sl){ var n=+sl.dataset.s; sl.classList.toggle("on",n===i); sl.classList.toggle("back",n<i); });
  render(); growBars(); if(prev!==i) countStats(); if(innerWidth<=860) window.scrollTo(0,0); }
/* Fill the whole window: scale so the 1600x900 design fits, then stretch the canvas to the window's shape (no empty bars, no cropping). */
function fit(){ var vp=$("viewport"), st=$("stage"); if(innerWidth<=860){ st.style.transform=""; st.style.width=""; st.style.height=""; return; }
  var W=vp.clientWidth, H=vp.clientHeight, s=Math.min(W/1600, H/900);
  st.style.width=(W/s)+"px"; st.style.height=(H/s)+"px"; st.style.transform="translate(-50%,-50%) scale("+s+")"; }
/* Scroll wheel / trackpad / swipe = next or previous slide (desktop & tablet). Lists that scroll keep scrolling first. */
(function(){
  /* Trackpads keep sending "momentum" events for 1-2s after one swipe. Ignore momentum (deltas that keep shrinking),
     but accept a NEW swipe straight away: a pause, a direction change, or deltas that speed up again. */
  var acc=0, lockUntil=0, lastEvt=0, armed=true, hist=[], lastDir=0;
  function scroller(el,dy){ while(el&&el!==document.body){ var cs=getComputedStyle(el);
      if(/(auto|scroll)/.test(cs.overflowY)&&el.scrollHeight>el.clientHeight+1){ if(dy>0? el.scrollTop+el.clientHeight<el.scrollHeight-1 : el.scrollTop>0) return el; }
      el=el.parentElement; } return null; }
  function step(d){ if((d>0&&state.s<4)||(d<0&&state.s>0)) go(state.s+d); }
  addEventListener("wheel",function(e){ if(innerWidth<=860||!$("lb").hidden) return;
    var dy=Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX; if(!dy||scroller(e.target,dy)) return;
    e.preventDefault(); var now=Date.now(), gap=now-lastEvt, ad=Math.abs(dy), dir=dy>0?1:-1; lastEvt=now;
    var prev=hist.slice(-4), avg=prev.length?prev.reduce(function(a,b){return a+b;},0)/prev.length:0;
    var fresh = gap>160 || dir!==lastDir || (prev.length>=3 && ad>avg*1.35 && ad>6);
    hist.push(ad); if(hist.length>8) hist.shift(); lastDir=dir;
    if(now<lockUntil) return;                          /* let the slide animation start */
    if(!armed){ if(!fresh) return; armed=true; acc=0; } /* still momentum from the last swipe */
    acc+=dy; if(Math.abs(acc)>=30){ step(acc>0?1:-1); acc=0; armed=false; lockUntil=now+420; }
  },{passive:false});
  var tx=0,ty=0,tt=null;
  addEventListener("touchstart",function(e){ if(innerWidth<=860) return; var t=e.touches[0]; tx=t.clientX; ty=t.clientY; tt=e.target; },{passive:true});
  addEventListener("touchend",function(e){ if(innerWidth<=860||!tt||!$("lb").hidden) return; var t=e.changedTouches[0], dx=tx-t.clientX, dy=ty-t.clientY;
    var d=Math.abs(dx)>Math.abs(dy)?dx:dy; if(Math.abs(d)<60) return; if(Math.abs(dy)>Math.abs(dx)&&scroller(tt,dy)) return; step(d>0?1:-1); tt=null; },{passive:true});
})();
function openLb(src,alt){ $("lb-img").src=src; $("lb-img").alt=alt; $("lb").hidden=false; $("lb-x").focus(); }
$("lb-x").addEventListener("click",function(){$("lb").hidden=true;}); $("lb").addEventListener("click",function(e){ if(e.target.id==="lb") $("lb").hidden=true; });
$("prev").addEventListener("click",function(){go(state.s-1);}); $("next").addEventListener("click",function(){go(state.s+1);});
document.addEventListener("keydown",function(e){ if(!$("lb").hidden){ if(e.key==="Escape") $("lb").hidden=true; return; } if(/INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ e.preventDefault(); go(state.s+1);} else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); go(state.s-1);} else if(/^[1-5]$/.test(e.key)) go(+e.key-1); });
document.querySelectorAll(".lang button").forEach(function(b){ b.addEventListener("click",function(){ state.lang=b.dataset.lang; try{localStorage.setItem("dms-deck-lang",state.lang);}catch(e){} render(); }); });
$("fs").addEventListener("click",function(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(function(){}); }catch(e){} });
function copyText(text,ok,fail){ var fb=function(){ var ta=$("fallback"); ta.hidden=false; ta.value=text; ta.focus(); ta.select(); $("toast").textContent=fail; };
  try{ navigator.clipboard.writeText(text).then(function(){ $("toast").textContent=ok; },fb); }catch(e){ fb(); } }
$("confirm").addEventListener("click",function(){ var t=T[state.lang]; copyText(summaryText(),t.copied,t.copy2); });
$("copy").addEventListener("click",function(){ var t=T[state.lang]; copyText(summaryText(),t.copied,t.copy2); });
$("mk").addEventListener("click",function(){ var t=T[state.lang], d=new Date(Date.now()+48*3600e3), url=location.href.split("#")[0]+"#"+dlCode(d); copyText(url,t.mkd+" "+fmtDT(d),url); });
addEventListener("resize",fit); addEventListener("hashchange",render); setInterval(function(){ if(state.s===4) render(); },30000);
render(); fit(); go(0);
</script>
